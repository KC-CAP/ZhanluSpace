[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "zhanlu-worker"
version = "0.1.0"
description = "Local knowledge compiler worker for Obsidian and Hermes"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "respx>=0.22,<1",
]

[project.scripts]
zhanlu-worker = "zhanlu_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zhanlu_worker = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
